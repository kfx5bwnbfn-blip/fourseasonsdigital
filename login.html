<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Four Seasons Digital — Sign In</title>
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="/login.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h1>Four Seasons Digital</h1>
      <p class="login-subtitle">Baymard UX Audit Tracker</p>
    </div>
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" autofocus>
      </div>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="login-btn">Sign In</button>
    </form>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('loginError');
  const btn = document.querySelector('.login-btn');

  errorEl.textContent = '';
  errorEl.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    if (resp.ok) {
      // Redirect to the main page
      window.location.href = '/index.html';
    } else {
      const data = await resp.json().catch(() => ({}));
      errorEl.textContent = data.error || 'Invalid password. Please try again.';
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Sign In';
      document.getElementById('password').select();
    }
  } catch (err) {
    errorEl.textContent = 'Connection error. Please try again.';
    errorEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});
</script>

</body>
</html>
