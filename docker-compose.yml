services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: baymard_tracker
      POSTGRES_USER: fs_tracker
      POSTGRES_PASSWORD: fs_tracker_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fs_tracker -d baymard_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: baymard_tracker
      DB_USER: fs_tracker
      DB_PASSWORD: fs_tracker_secret
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
