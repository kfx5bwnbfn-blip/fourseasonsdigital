*, *::before, *::after { box-sizing: border-box; }

:root {
  --text-primary: #000000;
  --text-secondary: #555;
  --text-muted: #888;
  --bg-page: #FFFCF9;       /* White Sand */
  --bg-card: #FFFFFF;        /* White */
  --bg-subtle: #F5F2EE;      /* Warm Stone tint */
  --accent: #3D441E;         /* Ever Green — brand color */
  --accent-dark: #2A2F15;    /* Darker Ever Green */
  --accent-light: #CBC4BC;   /* Warm Stone */
  --gold: #3D441E;           /* Ever Green replaces gold */
  --gold-light: #EDE9E4;    /* Warm Stone light tint */
  --success: #3D441E;        /* Ever Green */
  --success-light: #E8E6DF;  /* Warm Stone light */
  --warning: #B6533E;        /* Earthen */
  --warning-light: #F2E3DE;  /* Earthen light */
  --danger: #B6533E;         /* Earthen */
  --danger-light: #F2E3DE;   /* Earthen light */
  --info: #3D441E;           /* Ever Green */
  --info-light: #E8E6DF;     /* Warm Stone light */
  --border: #CBC4BC;         /* Warm Stone */
  --border-strong: #B5ACA0;  /* Warm Stone darker */
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
}

*, *::before, *::after { box-sizing: border-box; }

:root {
  --text-primary: #000000;
  --text-secondary: #555;
  --text-muted: #888;
  --bg-page: #FFFCF9;
  --bg-card: #FFFFFF;
  --bg-subtle: #F5F2EE;
  --accent: #3D441E;
  --accent-dark: #2A2F15;
  --accent-light: #CBC4BC;
  --warm-stone: #CBC4BC;
  --white-sand: #FFFCF9;
  --cashmere: #D4B59E;
  --earthen: #B6533E;
  --border: #CBC4BC;
  --border-strong: #B5ACA0;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
  --done: #4CAF50;
  --done-light: #E8F5E9;
  --pending: #B0B0B0;
  --pending-light: #F0F0F0;
  --in-progress: #2196F3;
  --in-progress-light: #E3F2FD;
}

body {
  margin: 0;
  padding: 0;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  color: var(--text-primary);
  background: var(--bg-page);
}

/* === Header === */
header {
  background: #3D441E;
  color: #fff;
  padding: 2.5rem 2rem 2rem;
  position: relative;
  overflow: hidden;
}
header::after {
  content: "";
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: #CBC4BC;
}

/* === Page Navigation Tabs === */
.page-nav {

  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.page-nav-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  gap: 0;
}
.page-nav-tab {

  font-size: 0.95rem;
  font-weight: 600;
  padding: 1rem 1.8rem;
  color: var(--text-secondary);
  text-decoration: none;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.page-nav-tab:hover { color: var(--accent); background: var(--bg-subtle); }
.page-nav-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 700;
}
.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 1rem;
}
.header-title h1 {
  font-family: 'Saol Display', Georgia, serif;
  font-size: 2.2rem;
  font-weight: 300;
  margin: 0 0 0.3rem;
  letter-spacing: 0.5px;
}
.header-title .subtitle {
  font-size: 0.95rem;
  color: rgba(255,255,255,0.7);
  font-style: italic;
  font-family: 'Saol Display', Georgia, serif;
  font-weight: 300;
}
.header-meta {
  text-align: right;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.6);
}
.header-meta .label { display: block; text-transform: uppercase; letter-spacing: 1px; font-size: 0.7rem; }
.header-meta .value { color: #CBC4BC; font-size: 1.1rem; font-weight: 600; }

/* === Container === */
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem;
}

/* === Summary KPIs === */
.summary-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.summary-card {
  background: var(--bg-card);
  border-radius: 10px;
  padding: 1.5rem 1.8rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  border-top: 3px solid var(--accent);
}
.summary-card.green { border-top-color: var(--done); }
.summary-card.blue { border-top-color: var(--in-progress); }
.summary-card.grey { border-top-color: var(--pending); }
.summary-card .s-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-muted);
  margin-bottom: 0.4rem;
}
.summary-card .s-value {
  font-family: 'Saol Display', Georgia, serif;
  font-size: 2.4rem;
  font-weight: 300;
  line-height: 1;
  color: var(--text-primary);
}
.summary-card .s-sub {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-top: 0.3rem;
}

/* === Overall Progress Bar === */
.overall-progress {
  background: var(--bg-card);
  border-radius: 10px;
  padding: 1.5rem 1.8rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  margin-bottom: 2rem;
}
.overall-progress-title {
  font-family: 'Saol Display', Georgia, serif;
  font-size: 1.2rem;
  font-weight: 300;
  margin: 0 0 1rem;
  color: var(--accent);
}
.progress-bar-container {
  display: flex;
  height: 36px;
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 0.8rem;
  border: 1px solid var(--border);
}
.progress-segment {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.78rem;
  font-weight: 600;
  color: #fff;
  transition: flex 0.3s;
  white-space: nowrap;
  overflow: hidden;
}
.progress-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 1.2rem;
  font-size: 0.82rem;
}
.legend-item { display: flex; align-items: center; gap: 0.4rem; }
.legend-dot { width: 12px; height: 12px; border-radius: 3px; }

/* === Channel Sections === */
.channel-section {
  margin-bottom: 2.5rem;
}
.channel-header {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 1rem;
  padding-bottom: 0.6rem;
  border-bottom: 2px solid var(--accent);
}
.channel-header h2 {
  font-family: 'Saol Display', Georgia, serif;
  font-size: 1.6rem;
  font-weight: 300;
  margin: 0;
  color: var(--accent);
}
.channel-badge {
  font-size: 0.75rem;
  font-weight: 700;
  background: var(--accent);
  color: #fff;
  padding: 3px 12px;
  border-radius: 12px;
}
.channel-stats {
  margin-left: auto;
  display: flex;
  gap: 1.5rem;
  font-size: 0.82rem;
  color: var(--text-secondary);
}
.channel-stat { display: flex; align-items: center; gap: 0.3rem; }
.channel-stat .num { font-weight: 700; color: var(--text-primary); font-size: 1rem; }

/* === Bucket Columns === */
.bucket-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1rem;
}
.bucket-col {
  background: var(--bg-card);
  border-radius: 10px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  overflow: hidden;
}
.bucket-col-header {
  padding: 0.8rem 1rem;
  background: var(--bg-subtle);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.bucket-col-header h3 {
  font-family: 'Saol Display', Georgia, serif;
  font-size: 1.05rem;
  font-weight: 300;
  margin: 0;
  color: var(--accent);
}
.bucket-count {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-muted);
  background: var(--bg-card);
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.bucket-items {
  padding: 0.5rem;
}
.bucket-item {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
  padding: 0.6rem 0.5rem;
  border-radius: 6px;
  transition: background 0.15s;
}
.bucket-item:hover { background: var(--bg-subtle); }
.item-status-icon {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  margin-top: 1px;
}
.item-status-icon.done {
  background: var(--done);
  color: #fff;
}
.item-status-icon.in-progress {
  background: var(--in-progress);
  color: #fff;
}
.item-status-icon.pending {
  background: var(--pending);
  color: #fff;
}
.item-content {
  flex: 1;
  min-width: 0;
}
.item-guideline {
  font-size: 0.82rem;
  line-height: 1.4;
  color: var(--text-primary);
}
.item-guideline .gid {
  font-weight: 700;
  color: var(--accent);
}
.item-meta {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-top: 0.2rem;
}

/* === Footer === */
footer {
  text-align: center;
  padding: 2rem;
  font-size: 0.78rem;
  color: var(--text-muted);
}
footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
footer a:hover { text-decoration: underline; }

/* === Responsive === */
@media (max-width: 768px) {
  .header-inner { flex-direction: column; align-items: flex-start; }
  .header-meta { text-align: left; }
  .bucket-grid { grid-template-columns: 1fr; }
  .channel-stats { flex-direction: column; gap: 0.3rem; }
}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('dataPayload').textContent);
const STATUS_STORAGE_KEY = 'roadmap_status_overrides_v2';

// Status definitions
const STATUSES = {
  'Identified': { key: 'identified', label: 'Identified', order: 0 },
  'Ticket Created': { key: 'ticket-created', label: 'Ticket Created', order: 1 },
  'In Planning': { key: 'in-planning', label: 'In Planning', order: 2 },
  'In Design': { key: 'in-design', label: 'In Design', order: 3 },
  'In Development': { key: 'in-development', label: 'In Development', order: 4 },
  'In QA': { key: 'in-qa', label: 'In QA', order: 5 },
  'In UAT': { key: 'in-uat', label: 'In UAT', order: 6 },
  'In Production': { key: 'in-production', label: 'In Production', order: 7 }
};

function getStatusInfo(status) {
  if (STATUSES[status]) return STATUSES[status];
  return STATUSES['Identified'];
}

function mapBucketToStatus(bucket) {
  const b = (bucket || '').toLowerCase();
  if (b.includes('not addressing')) return 'Identified';
  if (b.includes('in progress')) return 'In Development';
  if (b.includes('addressed')) return 'In Production';
  if (b.includes('redesign')) return 'In Planning';
  if (b.includes('2027')) return 'Identified';
  if (b.includes('nls')) return 'In Planning';
  if (b.includes('gap')) return 'Identified';
  return 'Identified';
}

DATA.forEach(d => { d.mappedStatus = mapBucketToStatus(d.bucket); });

function getItemKey(d) {
  return d.channel + '|' + d.guidelineId + '|' + (d.page || '') + '|' + (d.guideline || '').substring(0, 40);
}

function getStatusOverrides() {
  try { return JSON.parse(localStorage.getItem(STATUS_STORAGE_KEY) || '{}'); }
  catch(e) { return {}; }
}

function getEffectiveStatus(d) {
  const overrides = getStatusOverrides();
  const key = getItemKey(d);
  if (overrides[key]) return overrides[key];
  return d.mappedStatus || 'Identified';
}

// Determine if an item is "done" (in production), "in progress" (any dev stage), or "pending"
function getItemState(d) {
  const status = getEffectiveStatus(d);
  const key = getStatusInfo(status).key;
  if (key === 'in-production') return 'done';
  if (['in-development','in-qa','in-uat','in-design'].includes(key)) return 'in-progress';
  return 'pending';
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// === Render Summary KPIs ===
function renderSummary() {
  const total = DATA.length;
  const done = DATA.filter(d => getItemState(d) === 'done').length;
  const inProgress = DATA.filter(d => getItemState(d) === 'in-progress').length;
  const pending = DATA.filter(d => getItemState(d) === 'pending').length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  const webTotal = DATA.filter(d => d.channel === 'WEB').length;
  const webDone = DATA.filter(d => d.channel === 'WEB' && getItemState(d) === 'done').length;
  const appTotal = DATA.filter(d => d.channel === 'APP').length;
  const appDone = DATA.filter(d => d.channel === 'APP' && getItemState(d) === 'done').length;

  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-card green">
      <div class="s-label">Findings Addressed</div>
      <div class="s-value">${done}/${total}</div>
      <div class="s-sub">${pct}% of all findings closed</div>
    </div>
    <div class="summary-card blue">
      <div class="s-label">In Progress</div>
      <div class="s-value">${inProgress}</div>
      <div class="s-sub">In design, development, QA, or UAT</div>
    </div>
    <div class="summary-card grey">
      <div class="s-label">Not Yet Started</div>
      <div class="s-value">${pending}</div>
      <div class="s-sub">Identified or ticket created</div>
    </div>
    <div class="summary-card">
      <div class="s-label">Website Progress</div>
      <div class="s-value">${webDone}/${webTotal}</div>
      <div class="s-sub">${Math.round(webDone/webTotal*100)}% addressed</div>
    </div>
    <div class="summary-card">
      <div class="s-label">Mobile App Progress</div>
      <div class="s-value">${appDone}/${appTotal}</div>
      <div class="s-sub">${Math.round(appDone/appTotal*100)}% addressed</div>
    </div>
  `;
}

// === Render Overall Progress Bar ===
function renderProgressBar() {
  const order = ['identified','ticket-created','in-planning','in-design','in-development','in-qa','in-uat','in-production'];
  const colors = { 'identified':'#B0B0B0','ticket-created':'#90CAF9','in-planning':'#64B5F6','in-design':'#42A5F5','in-development':'#2196F3','in-qa':'#1E88E5','in-uat':'#1565C0','in-production':'#4CAF50' };
  const labels = { 'identified':'Identified','ticket-created':'Ticket Created','in-planning':'In Planning','in-design':'In Design','in-development':'In Development','in-qa':'In QA','in-uat':'In UAT','in-production':'In Production' };

  const statuses = {};
  order.forEach(k => statuses[k] = { count: 0, label: labels[k], color: colors[k] });
  DATA.forEach(d => {
    const k = getStatusInfo(getEffectiveStatus(d)).key;
    if (statuses[k]) statuses[k].count++;
  });

  const total = DATA.length;
  let barHtml = '';
  let legendHtml = '';
  order.forEach(key => {
    const s = statuses[key];
    if (s.count > 0) {
      const pct = (s.count / total) * 100;
      barHtml += '<div class="progress-segment" style="flex:' + pct + ';background:' + s.color + ';" title="' + s.label + ': ' + s.count + '">' + (pct > 5 ? s.count : '') + '</div>';
    }
    legendHtml += '<div class="legend-item"><span class="legend-dot" style="background:' + s.color + ';"></span>' + s.label + ' (' + s.count + ')</div>';
  });
  document.getElementById('progressBar').innerHTML = barHtml;
  document.getElementById('progressLegend').innerHTML = legendHtml;
}

// === Render Channel Sections ===
function renderChannels() {
  const channels = [
    { key: 'WEB', label: 'Website', icon: '🌐' },
    { key: 'APP', label: 'Mobile App', icon: '📱' }
  ];

  let html = '';
  channels.forEach(ch => {
    const items = DATA.filter(d => d.channel === ch.key);
    const done = items.filter(d => getItemState(d) === 'done').length;
    const inProgress = items.filter(d => getItemState(d) === 'in-progress').length;
    const pending = items.filter(d => getItemState(d) === 'pending').length;
    const pct = items.length > 0 ? Math.round((done / items.length) * 100) : 0;

    // Group by bucket
    const buckets = {};
    items.forEach(d => {
      const b = d.bucket || 'Uncategorized';
      if (!buckets[b]) buckets[b] = [];
      buckets[b].push(d);
    });

    // Sort buckets: Addressed first, then by count descending
    const bucketOrder = Object.keys(buckets).sort((a, b) => {
      const aDone = buckets[a].filter(d => getItemState(d) === 'done').length;
      const bDone = buckets[b].filter(d => getItemState(d) === 'done').length;
      return bDone - aDone || buckets[b].length - buckets[a].length;
    });

    html += '<div class="channel-section">';
    html += '<div class="channel-header">';
    html += '<h2>' + ch.label + '</h2>';
    html += '<span class="channel-badge">' + items.length + ' findings</span>';
    html += '<div class="channel-stats">';
    html += '<div class="channel-stat"><span class="num">' + done + '</span> done</div>';
    html += '<div class="channel-stat"><span class="num">' + inProgress + '</span> in progress</div>';
    html += '<div class="channel-stat"><span class="num">' + pending + '</span> pending</div>';
    html += '<div class="channel-stat"><span class="num">' + pct + '%</span> complete</div>';
    html += '</div>';
    html += '</div>';

    html += '<div class="bucket-grid">';
    bucketOrder.forEach(bucketName => {
      const bucketItems = buckets[bucketName];
      const bucketDone = bucketItems.filter(d => getItemState(d) === 'done').length;
      const bucketInProgress = bucketItems.filter(d => getItemState(d) === 'in-progress').length;

      html += '<div class="bucket-col">';
      html += '<div class="bucket-col-header">';
      html += '<h3>' + escapeHtml(bucketName) + '</h3>';
      html += '<span class="bucket-count">' + bucketDone + '/' + bucketItems.length + ' done</span>';
      html += '</div>';
      html += '<div class="bucket-items">';
      bucketItems.forEach(d => {
        const state = getItemState(d);
        const iconClass = state;
        const icon = state === 'done' ? '✓' : state === 'in-progress' ? '◐' : '○';
        const gid = d.guidelineId || '';
        const guidelineText = d.guideline || d.suggestion || '';
        // Remove the #ID prefix from the guideline text for cleaner display
        const cleanGuideline = guidelineText.replace(/^#\d+\s*/, '');
        const theme = d.theme || '';

        html += '<div class="bucket-item">';
        html += '<div class="item-status-icon ' + iconClass + '">' + icon + '</div>';
        html += '<div class="item-content">';
        html += '<div class="item-guideline"><span class="gid">#' + escapeHtml(gid) + '</span> ' + escapeHtml(cleanGuideline) + '</div>';
        if (theme) html += '<div class="item-meta">' + escapeHtml(theme) + '</div>';
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
      html += '</div>';
    });
    html += '</div>'; // bucket-grid
    html += '</div>'; // channel-section
  });

  document.getElementById('channelSections').innerHTML = html;
}

// === Init ===
function init() {
  document.getElementById('lastUpdated').textContent = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  renderSummary();
  renderProgressBar();
  renderChannels();
}

init();
</script>
